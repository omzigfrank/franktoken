name: Build installers

# Build Windows / macOS / Linux installers and attach them to a GitHub Release.
#
# Three ways to release, in order of convenience:
#   1. Bump "version" in package.json and merge to main — this workflow notices
#      there is no release for that version yet and publishes one, creating the
#      tag itself. No local git tag needed.
#   2. Push a tag like v0.3.0 directly.
#   3. Actions -> Run workflow, with "publish_release" ticked.
# Running manually with the box unticked just builds installers as downloadable
# artifacts without touching releases.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release for package.json's version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Resolve the target version and decide whether it still needs a release, so a
  # routine push to main doesn't rebuild three platforms for nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A DRAFT release counts as NOT released. Treating it as done would
          # let one failed publish block that version from ever building again:
          # v0.5.0 got stuck exactly this way when GitHub returned a 500 on the
          # final draft->published flip, leaving a draft nobody could see.
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            false)
              echo "$tag is already published."
              echo "needs_release=false" >> "$GITHUB_OUTPUT" ;;
            true)
              echo "$tag exists but is still a DRAFT — rebuilding to complete it."
              echo "needs_release=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "$tag has no release yet."
              echo "needs_release=true" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    # Always build for a tag push or a manual run; on a main push only when the
    # version is unreleased.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      needs.version.outputs.needs_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: macos-latest
            cmd: npm run dist:mac
          - os: ubuntu-latest
            cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Export CSC_LINK only when a certificate is actually configured. An
          # EMPTY CSC_LINK is worse than an absent one: the macOS target
          # resolves it against the working directory and dies with
          # "<repo root> not a file". Setting it to '' here broke the first
          # v0.4.2 release build (mac leg only; Windows and Linux tolerated it).
          if [ -n "${WINDOWS_CERT_BASE64:-}" ]; then
            export CSC_LINK="$WINDOWS_CERT_BASE64"
            export CSC_KEY_PASSWORD="${WINDOWS_CERT_PASSWORD:-}"
          fi
          ${{ matrix.cmd }} -- --publish never
        env:
          # macOS signing stays off: no Apple Developer certificate configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Windows signing is opt-in. With none of these set the build still
          # succeeds and produces unsigned artifacts, so forks keep working.
          # Route 1 — Azure Trusted Signing (publicly trusted, ~$10/mo). Safe to
          # pass through possibly-empty: electron-builder.config.cjs requires all
          # three to be non-empty before it emits azureSignOptions at all.
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.os == 'windows-latest' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.os == 'windows-latest' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ matrix.os == 'windows-latest' && secrets.AZURE_TRUSTED_SIGNING_PROFILE || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'windows-latest' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'windows-latest' && secrets.AZURE_CLIENT_SECRET || '' }}
          # Route 2 — a .pfx certificate, base64-encoded into the secret. Read by
          # the guard above rather than exported directly, and scoped to the
          # Windows leg so a certificate can never be picked up on macOS.
          WINDOWS_CERT_BASE64: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_BASE64 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_PASSWORD || '' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: franktoken-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: [version, build]
    if: >-
      github.ref_type == 'tag' ||
      (needs.version.outputs.needs_release == 'true' &&
       (github.event_name == 'push' || github.event.inputs.publish_release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | sed 's| .*/| |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push honour the pushed tag; otherwise create the tag for
          # package.json's version at this commit.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
      # A transient 500 during the final draft->published flip leaves the
      # release invisible even though every asset uploaded. Publish it
      # explicitly, with retries, so a GitHub blip cannot silently swallow a
      # release.
      - name: Ensure the release is published
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
            case "$state" in
              false) echo "$TAG is published."; exit 0 ;;
              missing) echo "attempt $attempt: $TAG does not exist yet"; ;;
              *) echo "attempt $attempt: $TAG is a draft — publishing"
                 gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false || true ;;
            esac
            sleep $((attempt * 10))
          done
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then echo "$TAG is published."; exit 0; fi
          echo "::error::$TAG is still $state after 5 attempts"
          exit 1
      # Publishing is not the same as being complete. A transient 500 mid-upload
      # can leave a published release missing an installer while SHA256SUMS
      # still lists it — v0.5.2 shipped without its Linux AppImage exactly that
      # way. Re-attach anything absent rather than leaving the release wrong.
      - name: Verify every installer is attached
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
        run: |
          set -uo pipefail
          attached() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              -q '.assets[].name' 2>/dev/null || true
          }
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name=$(basename "$f")
            for attempt in 1 2 3; do
              if attached | grep -qxF "$name"; then break; fi
              echo "attempt $attempt: $name not attached — uploading"
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
              sleep $((attempt * 10))
            done
            if attached | grep -qxF "$name"; then
              echo "ok: $name"
            else
              echo "::error::$name is still missing from $TAG"
              missing=1
            fi
          done <<EOF
          $(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) 2>/dev/null)
          SHA256SUMS.txt
          EOF
          exit $missing
