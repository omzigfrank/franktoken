services:
  franktoken:
    build: .
    restart: unless-stopped
    ports:
      - "4319:4319"
    environment:
      FRANKTOKEN_INGEST_TOKEN: ${FRANKTOKEN_INGEST_TOKEN:?set FRANKTOKEN_INGEST_TOKEN}
      FRANKTOKEN_SHARE_TOKEN: ${FRANKTOKEN_SHARE_TOKEN:?set FRANKTOKEN_SHARE_TOKEN}
      FRANKTOKEN_OPENAI_ADMIN_KEY: ${FRANKTOKEN_OPENAI_ADMIN_KEY:-}
      FRANKTOKEN_ANTHROPIC_ADMIN_KEY: ${FRANKTOKEN_ANTHROPIC_ADMIN_KEY:-}
      FRANKTOKEN_ANTHROPIC_ANALYTICS_KEY: ${FRANKTOKEN_ANTHROPIC_ANALYTICS_KEY:-}
      FRANKTOKEN_CLOUD_POLL_SECONDS: ${FRANKTOKEN_CLOUD_POLL_SECONDS:-60}
    volumes:
      - franktoken-data:/app/data

volumes:
  franktoken-data:
